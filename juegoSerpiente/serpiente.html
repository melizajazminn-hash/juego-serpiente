<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Juego de la Serpiente - Taller</title>
   <link rel="stylesheet" href="serpiente.css">
</head>
<body>
  <main class="contenedor-juego">
    <h1>🐍 Juego de la Serpiente</h1>
    <p class="descripcion">
      ¡Guía a la serpiente neón, devora las manzanas cibernéticas y rompe tu propio récord sin estrellarte contra los bordes!
    </p>

    <a href="https://drive.google.com/file/d/1br_qHemi-ZDGtBhOT8dxITAGaYOYDIbM/view?usp=drive_link" target="_blank" class="enlace-video">📺 Ver Video Explicativo del Juego</a>


    <section class="panel-info">
      <div class="tarjeta-info">
        <span>Puntaje</span>
        <strong id="puntaje">0</strong>
      </div>
      <div class="tarjeta-info">
        <span>Estado</span>
        <strong id="estado">Listo</strong>
      </div>
    </section>

    <canvas id="canvasJuego" width="600" height="600"></canvas>

    <!-- Control de movimiento en cruz (Grid) -->
    <section class="controles">
      <button class="vacio">-</button>
      <button onclick="cambiarDireccion('arriba')">⬆️</button>
      <button class="vacio">-</button>

      <button onclick="cambiarDireccion('izquierda')">⬅️</button>
      <button onclick="pausarJuego()">⏸️</button>
      <button onclick="cambiarDireccion('derecha')">➡️</button>

      <button class="vacio">-</button>
      <button onclick="cambiarDireccion('abajo')">⬇️</button>
      <button class="vacio">-</button>
    </section>

    <!-- Botones principales de acción -->
    <section class="acciones">
      <button onclick="iniciarJuego()">▶️ Iniciar</button>
      <button class="secundario" onclick="pausarJuego()">⏸️ Pausar</button>
      <button class="secundario" onclick="reiniciarJuego()">🔄 Reiniciar</button>
    </section>

    <p id="mensaje" class="mensaje">Presiona Iniciar para comenzar.</p>
  </main>

  <script src="serpiente.js"></script>
</body>
</html>
